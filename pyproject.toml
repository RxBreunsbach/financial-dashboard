[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "apscheduler",
    "pandas",
    "duckdb",
    "pyarrow",
    "python-dotenv",
    "pyyaml",
    "requests",
    "yfinance",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
backfill = "app.cli:main"
dev = "app.dev:main"
kiosk = "app.kiosk:main"
fresh_start = "app.fresh_start:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
